<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}FaceGuard — Contrôle d'accès IA{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app-shell">
    <nav class="sidebar">
        <div class="brand">
            <span class="brand-mark">◈</span>
            <div class="brand-text">
                <span class="brand-name">FaceGuard</span>
                <span class="brand-sub">Contrôle d'accès IA</span>
            </div>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link {% block nav_dashboard %}{% endblock %}">
                <span class="nav-icon">▣</span> Tableau de bord
            </a>
            <a href="/scanner" class="nav-link {% block nav_scanner %}{% endblock %}">
                <span class="nav-icon">◎</span> Scanner live
            </a>
            <a href="/register" class="nav-link {% block nav_register %}{% endblock %}">
                <span class="nav-icon">◉</span> Ajouter une personne
            </a>
        </div>
        <div class="sidebar-footer">
            <span class="status-dot"></span> Système actif
        </div>
    </nav>

    <main class="content">
        {% block content %}{% endblock %}
    </main>
</div>
</body>
</html>
